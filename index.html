<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Buggames — 61 Game Offline Anti Gabut!</title>
<meta name="description" content="Buggames: koleksi 61 mini game seru bareng Buggy si maskot bug, termasuk balapan 3D, petualangan hutan 3D, dan simulasi helikopter 3D. Offline, gratis, bisa di-install di Android." />
<meta name="theme-color" content="#241239" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>

<div id="app">

  <!-- ===== HOME ===== -->
  <header class="top">
    <div class="mascot" id="mascotHome" aria-hidden="true"></div>
    <div class="logo-text">
      <h1>BUGGAMES</h1>
      <p>Anti Gabut Club</p>
    </div>
    <div class="top-actions">
      <button id="installBtn" class="install-btn hidden">+ Install</button>
      <button id="soundBtn" class="icon-btn" aria-label="Suara on/off"></button>
    </div>
  </header>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="6.5" stroke="#241239" stroke-width="2.4"/><path d="M15.5 15.5L21 21" stroke="#241239" stroke-width="2.4" stroke-linecap="round"/></svg>
    <input id="searchInput" type="text" placeholder="Cari game... misal: ular, kuis, bom" autocomplete="off" />
  </div>

  <div class="cats" id="catChips"></div>

  <main id="gameGrid" class="grid" aria-label="Daftar game"></main>

  <div id="emptyState" class="empty-state hidden">
    <div id="emptyMascot"></div>
    <h3>Hmm, game-nya belum ketemu...</h3>
    <p>Coba kata kunci lain, misalnya “ular”, “kuis”, atau “puzzle”.</p>
  </div>

  <footer class="foot"><b>BUGGAMES</b> • 61 game offline • gratis • tanpa iklan • <span id="footCount"></span></footer>

  <!-- ===== GAME VIEW ===== -->
  <section id="gameView" class="game-view hidden" aria-label="Sedang bermain">
    <div class="game-topbar">
      <button id="backBtn" class="back-btn" aria-label="Kembali ke menu">←</button>
      <div id="gameTitle" class="game-title">Game</div>
      <div id="gameBest" class="game-best">Terbaik: –</div>
    </div>
    <div id="gameContainer" class="game-container"></div>
  </section>

</div>

<script src="./js/icons.js"></script>
<script src="./js/app.js"></script>
<script src="./js/games-action.js"></script>
<script src="./js/games-board.js"></script>
<script src="./js/games-quiz.js"></script>
<script src="./js/engine3d.js"></script>
<script src="./js/games-3d.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
</script>
</body>
</html>
